# Alembic configuration for CivicLens. Run every alembic command from the backend/ folder:
#   alembic upgrade head
#   alembic revision --autogenerate -m "message"
# The database URL is NOT stored here: alembic/env.py reads settings.DATABASE_URL (env var / backend/.env).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# Placeholder only - overridden in alembic/env.py from app.config.settings.DATABASE_URL
sqlalchemy.url = sqlite:///./civiclens.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
